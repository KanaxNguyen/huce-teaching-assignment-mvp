services:
  - type: web
    name: huce-tkb-api
    runtime: docker
    dockerfilePath: ./infra/backend.Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/storage/database/huce.db
      - key: CORS_ORIGINS
        sync: false
    disk:
      name: huce-tkb-storage
      mountPath: /app/storage
      sizeGB: 1

  - type: web
    name: huce-tkb-web
    runtime: docker
    dockerfilePath: ./infra/frontend.Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
